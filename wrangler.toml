name = "tom-tom"
main = "src/index.ts"
compatibility_date = "2026-04-16"
compatibility_flags = ["nodejs_compat_v2"]

[observability]
enabled = true

# ─────────────────────────────────────────────────────────────────────────────
# ZERO-CONFIG DEFAULT
# `wrangler deploy` from a fresh fork yields a working chat agent — Workers
# AI as the model, Helm in propose mode, no secrets required. Auth runs in
# "first-run permissive" mode (everyone is treated as a guest) until you
# set CF_ACCESS_TEAM_DOMAIN + CF_ACCESS_AUD; the /app UI shows a yellow
# banner the whole time so you don't forget to lock it down.
#
# Add features by uncommenting bindings below + extending ENABLED_PLUGINS.
# ─────────────────────────────────────────────────────────────────────────────

[vars]
# Default Workers AI model. We pick gpt-oss-120b — Cloudflare's hosted
# OpenAI open-weight 120B-parameter model. Strong tool-use and chat
# quality compared to llama-3.3 for our use case. Override at deploy time
# (or via dash → Worker → Settings → Variables) if you want different.
# All Workers AI models: dash → AI → Workers AI → Models.
MODEL_DEFAULT = "@cf/openai/gpt-oss-120b"
# Plugins enabled by default. Includes openrouter so when the user pastes
# OPENROUTER_API_KEY at deploy time, the chat picks it up immediately
# (auto-routes to the best model per prompt). admin + workers-ai give
# zero-config baseline; openrouter is the strong default when keyed.
ENABLED_PLUGINS = "admin,helm-setup,cloudflare-admin,workers-ai,openrouter"
# Outbound host allowlist enforced by the plugin bus. Defaults cover the
# most common providers including OpenRouter; extend as you add plugins.
ALLOWED_HOSTS = "api.cloudflare.com,mcp.cloudflare.com,api.anthropic.com,api.openai.com,openrouter.ai"
AGENT_NAME = "Helm"
AGENT_OWNER = "you"

# --- Auth: Cloudflare Access (recommended before exposing publicly) ---
# Create an Access app at dash → Zero Trust → Access → Applications.
# CF_ACCESS_TEAM_DOMAIN = "https://<your-team>.cloudflareaccess.com"
# CF_ACCESS_AUD = "<your-app-aud-tag>"
# CF_ACCESS_ALLOWED_EMAILS = "you@example.com"
# AGENT_OWNER_EMAIL = "you@example.com"

# --- Helm Shell container persistence + in-shell helm REPL ---
# All optional. Without R2_*, /persist inside the container is ephemeral.
# Without HELM_INTERNAL_TOKEN, the in-shell `helm` command can't reach back.
# HELM_WORKER_HOST = "helm.your-domain.workers.dev"  # auto-derived if not set
#
# Set the rest as Worker secrets, NOT in this file:
#   wrangler secret put HELM_INTERNAL_TOKEN   # any high-entropy random string
#   wrangler secret put R2_ACCESS_KEY_ID      # from dash → R2 → Manage R2 API Tokens
#   wrangler secret put R2_SECRET_ACCESS_KEY  # ditto
#   wrangler secret put R2_BUCKET             # bucket name (e.g. "helm-persist")

# Local dev only — bypass Access so `wrangler dev` works without a tunnel.
# Set this in `.dev.vars`, not here. NEVER set in production.
# DEV_AUTH_BYPASS = "1"

# Workers AI binding — powers the `workers-ai` plugin out of the box. Free.
[ai]
binding = "AI"

# Per-agent identity + tree-structured session storage. Auto-provisions.
[[durable_objects.bindings]]
name = "AGENT_SESSIONS"
class_name = "AgentSessionDO"

# Ephemeral multi-subscriber hub for streaming turns.
[[durable_objects.bindings]]
name = "STREAM_HUBS"
class_name = "StreamHubDO"

# WebSocket chat sessions — one DO per session name; holds the browser
# WebSocket connections + broadcasts conductor events to all connected tabs.
# Uses Cloudflare's Hibernation API so idle WS connections cost nothing.
[[durable_objects.bindings]]
name = "CHAT_SESSIONS"
class_name = "ChatSessionDO"

# Helm Shell — Cloudflare-Container-backed bash session. One container
# per session name; sleeps after 15m idle. Browser tab uses xterm.js;
# CLI uses scripts/open-think-shell.mjs. Image built from docker/shell/.
[[durable_objects.bindings]]
name = "SHELL_CONTAINER"
class_name = "ShellContainerDO"

# Singleton registry tracking active Helm Shell sessions. Lets /shell/list
# return "who has a container alive right now" without enumerating the
# whole DO namespace (CF doesn't support that). Always addressed via
# idFromName("global").
[[durable_objects.bindings]]
name = "SHELL_REGISTRY"
class_name = "ShellRegistryDO"

# Singleton broker for the CLI device-code login flow. Tracks pending
# (deviceCode, userCode) pairs + minted bearer tokens for the
# `npm run shell` CLI client and any other tools that want to auth
# without a CF Access JWT.
[[durable_objects.bindings]]
name = "CLI_AUTH"
class_name = "CliAuthDO"

[[containers]]
class_name = "ShellContainerDO"
image = "./docker/shell/Dockerfile"
max_instances = 5
# `basic` = 1/4 vCPU, 1 GiB RAM, 4 GB disk. Plenty for an interactive
# bash session + git/curl/jq workloads. Bump to standard-1 if users
# start running heavier toolchains (compile, ffmpeg, etc.).
instance_type = "basic"
name = "helm-shell"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentSessionDO"]

[[migrations]]
tag = "v2"
new_classes = ["StreamHubDO"]

[[migrations]]
tag = "v3"
new_classes = ["ChatSessionDO"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ShellContainerDO"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["ShellRegistryDO"]

[[migrations]]
tag = "v6"
new_sqlite_classes = ["CliAuthDO"]

# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL: PA stack bindings
# Uncomment ONE block at a time as you wire each feature up. Each block has
# a "do this first" line — follow it before redeploying or the deploy will
# fail validation.
# ─────────────────────────────────────────────────────────────────────────────

# --- Memory + email-inbox + notifications + scheduler + cost rollup ---
# DO THIS FIRST: `npx wrangler d1 create tom-tom-pa`, then paste the
# database_id below. The memory plugin auto-creates its tables on first
# write; same for email_inbox / notifications / cost_daily / pa_workflows.
# [[d1_databases]]
# binding = "DB"
# database_name = "tom-tom-pa"
# database_id = "<paste-from-wrangler-d1-create>"

# --- Outbound email via Cloudflare Email Workers ---
# DO THIS FIRST: dash → Email → Email Routing → enable on your sender domain
# and verify a destination. Then uncomment + redeploy.
# [[send_email]]
# name = "SEB"
# destination_address = "you@example.com"  # optional; omit for any-verified

# --- Morning briefing as a durable Workflow ---
# DO THIS FIRST: enable [[d1_databases]] above (the briefing reads/writes D1).
# [[workflows]]
# name = "morning-briefing"
# binding = "BRIEFING_WORKFLOW"
# class_name = "MorningBriefingWorkflow"

# --- Scheduled triggers ---
# DO THIS FIRST: enable [[d1_databases]] AND [[workflows]] above. The
# scheduled() handler is a no-op without DB; with both wired the cron fires
# the morning-briefing workflow + nightly cost-rollup.
# [triggers]
# crons = [ "55 12 * * *", "15 1 * * *" ]

# --- PA env vars (set whichever apply) ---
# OWNER_EMAIL           = "you@example.com"   # where PA notifications go
# FROM_EMAIL            = "helm@your-domain"  # outbound sender
# DEFAULT_TIMEZONE      = "America/New_York"
# INBOUND_FORWARD_TO    = "you@example.com"   # forward inbound mail after indexing
# CALENDAR_MCP_URL      = "https://your-cal-mcp.example.com"
# DAILY_SPEND_CAP_USD   = "5"                 # hard daily ceiling on LLM spend
# VAPID_PUBLIC_KEY      = "set via wrangler secret put"
# VAPID_PRIVATE_KEY     = "set via wrangler secret put"
# VAPID_SUBJECT         = "mailto:you@example.com"

# --- Optional integrations ---
# Browser Rendering — Tier-3 execution.
# [browser]
# binding = "BROWSER"

# Cloudflare Sandbox — Tier-4 execution (compile / shell).
# [[services]]
# binding = "SANDBOX"
# service = "my-sandbox-worker"

# R2 — workspace filesystem.
# [[r2_buckets]]
# binding = "WORKSPACE"
# bucket_name = "open-think-workspace"
